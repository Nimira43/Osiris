<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" type="image/png" href="../images/billy.png">
  <link rel="stylesheet" href="../css/styles.css">
  <title>Osiris | About Us</title>
</head>
<body class="body">
  <div class="container">
    <div class="menu-icon">
      <div class="line line-1"></div>
      <div class="line line-2"></div>
      <div class="line line-3"></div>
    </div>
    <nav class="navigation">
      <div class="nav-left">
        <img src="../images/nav-bg.jpg" alt="shadowdancer">
      </div>
      <div class="nav-right">
        <div class="nav-items">
          <a href="../index.html">Home</a>
          <a href="#">
            <span>01</span> Games
          </a>
          <a href="#">
            <span>02</span> Latest
          </a>
          <a href="./about.html">
            <span>03</span> About
          </a>
          <a href="#">
            <span>04</span> Contact
          </a>
        </div>
      </div>
    </nav>

    

    <footer id="contact" class="footer-about">
      <div class="footer-header">
        <h4 class="section-heading-sm games-heading-sm">Connect with Osiris</h4>
        <h1 class="section-heading-lg games-heading-lg">Contact Us</h1>
        <div class="section-border"></div>
      </div>
      <div class="footer-content">
        <div class="footer-social">
          <div class="address">
            <div>
              <i class="fa-regular fa-envelope"></i>
              <span>Address</span>  
            </div>
            <p class="address-par">
              <span>Osiris</span>
              <span>78 New Street</span>
              <span>3rd Floor, Dalton House</span>
              <span>York</span>
              <span>YO1 1AZ</span>
            </p>
          </div>
          <div class="social-media">
            <i class="fa-brands fa-square-facebook"></i>
            <i class="fa-brands fa-x-twitter"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-tiktok"></i>
          </div>
        </div>
        <div class="footer-form">
          <form>
            <div class="input-group">
              <input type="text" placeholder="Name">
              <input type="email" placeholder="Email">
              <input type="text" placeholder="Phone">
              <input type="text" placeholder="Address">
            </div>
            <textarea placeholder="Message"></textarea>
            <button type="button">Submit</button>
          </form>
        </div>
      </div>
      <div class="footer-bottom">
        <p>Osiris &copy; 2025. All Rights Reserved</p>
        <button type="button">
          <a href="#">Return to Top
            <i class="fa-solid fa-chevron-up"></i>
          </a>
        </button>
      </div>
    </footer>
  </div>

  <script src="./js/script.js"></script>
